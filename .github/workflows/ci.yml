name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Generated API types match openapi.yaml
        run: npm run gen -w @grip/api && git diff --exit-code packages/api/src/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_APP_NAME: CI
